<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
    <style>
        body {
            background-color: teal;
            font-family: Arial;
            text-align: center;
        }

        .box {
            background-color: white;
            width: 500px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px;
        }

        button {
            padding: 10px 20px;
            background-color: teal;
            color: white;
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Student Event Registration Form</h1>
        <p>Fill the Form Below and Register for the Event.</p>
    </div>

    <div class="box">
        <h2>Student Registration</h2>

        <input type="text" placeholder="Student Name">
        <input type="text" placeholder="Register Number">
        <input type="text" placeholder="Department">
        <input type="text" placeholder="Event Name">
        <input type="email" placeholder="Email">
        <input type="text" placeholder="Team Name">
        <input type="text" placeholder="Team Size">

        <br><br>
        <button>Register</button>
    </div>

</body>
</html>
